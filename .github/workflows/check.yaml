# Pithecene's standard Bosun prose check: the prose gate on the documents that
# bosun.yaml lists and on the pull request's title and body. It also runs in the
# merge queue. The pull request's run stays until a release reads a queued
# commit's title and body, because no earlier check reads them there.
name: check

on:
  pull_request:
    types: [opened, synchronize, reopened, edited]
  merge_group:
    types: [checks_requested]

permissions:
  contents: read

concurrency:
  group: check-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  bosun:
    # A fork's pull request holds no secrets, so it cannot pull the private image.
    # An edit matters only when it changes the title or body, which the gate reads.
    if: >-
      github.event_name == 'merge_group' ||
      (github.event.pull_request.head.repo.full_name == github.repository &&
       (github.event.action != 'edited' || github.event.changes.title || github.event.changes.body))
    runs-on: ubuntu-latest
    timeout-minutes: 15
    container:
      # Pinned, so a new Bosun rule cannot stop this required check's merges.
      image: ghcr.io/pithecene/bosun:0.4.0
      credentials: { username: bosun, password: "${{ secrets.BOSUN_REGISTRY_TOKEN }}" }
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      # The event holds the pull request or the queued commit.
      - run: bosun check --pull-request "$GITHUB_EVENT_PATH"
