# Pithecene's standard Bosun prose check: the prose gate on the documents that
# bosun.yaml lists and on the pull request's title and body. This repository is
# public, so the job runs on a hosted runner and checks out no credential.
name: check

on:
  pull_request:
    types: [opened, synchronize, reopened, edited]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: check-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  bosun:
    # A fork's pull request holds no secrets, so it cannot pull the private image.
    # An edit matters only when it changes the title or body, which the gate reads.
    if: >-
      github.event_name == 'push' ||
      (github.event.pull_request.head.repo.full_name == github.repository &&
       (github.event.action != 'edited' || github.event.changes.title || github.event.changes.body))
    runs-on: ubuntu-latest
    timeout-minutes: 15
    container:
      image: ghcr.io/pithecene/bosun:latest
      credentials: { username: bosun, password: "${{ secrets.BOSUN_REGISTRY_TOKEN }}" }
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      # The event holds the pull request, and a push holds none.
      - run: bosun check --pull-request "$GITHUB_EVENT_PATH"
