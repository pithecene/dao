version: "3"

vars:
  BUILD_DIR: build/debug
  PROFILE: profiles/clang-21-debug{{if eq OS "darwin"}}-macos{{end}}

tasks:
  deps:
    desc: Install Conan dependencies
    cmds:
      - >-
        conan install .
        -pr {{.PROFILE}}
        -pr:b {{.PROFILE}}
        --build=missing
        -of {{.BUILD_DIR}}
    sources:
      - conanfile.py
      - "{{.PROFILE}}"
    generates:
      - "{{.BUILD_DIR}}/conan_toolchain.cmake"

  configure:
    desc: Configure CMake
    deps: [deps]
    cmds:
      - cmake --preset debug
    sources:
      - CMakeLists.txt
      - compiler/**/CMakeLists.txt
      - tools/**/CMakeLists.txt
    generates:
      - "{{.BUILD_DIR}}/Makefile"

  build:
    desc: Build all targets
    deps: [configure]
    cmds:
      - cmake --build {{.BUILD_DIR}} -- -j${DAO_BUILD_JOBS:-4}

  test:
    desc: Run all tests
    deps: [build]
    cmds:
      - ctest --test-dir {{.BUILD_DIR}} --output-on-failure

  playground-install:
    desc: Install the playground frontend's pinned dependencies
    dir: tools/playground/frontend
    # A task that builds the frontend and then uses its tools installs once.
    run: once
    cmds:
      - npm ci --ignore-scripts

  playground-build:
    desc: Build playground frontend assets
    dir: tools/playground/frontend
    cmds:
      - task: playground-install
      - npm run build
    # Task resolves these against the task's directory.  The site imports
    # its snippets from the example corpus, so the examples are inputs too.
    sources:
      - src/**/*
      - index.html
      - package.json
      - package-lock.json
      - tsconfig.json
      - vite.config.ts
      - ../../../examples/**/*.dao
    generates:
      - dist/index.html
      - dist/assets/*

  playground:
    desc: Build and start the playground server (http://localhost:8090)
    deps: [build, playground-build]
    cmds:
      - "{{.BUILD_DIR}}/tools/playground/compiler_service/dao_playground {{.CLI_ARGS}}"

  playground-browser-test:
    desc: Run the playground's browser suite against the built service and frontend
    deps: [build, playground-build]
    # The browser is kept under the build directory, not in the user's
    # cache, so nothing outside the repository changes, and not in
    # node_modules, which `npm ci` empties.
    env:
      PLAYWRIGHT_BROWSERS_PATH: "{{if not (isAbs .BUILD_DIR)}}{{.ROOT_DIR}}/{{end}}{{.BUILD_DIR}}/playwright-browsers"
    cmds:
      # The frontend's build is skipped when its sources are unchanged,
      # whether or not its tools are still installed.
      - task: playground-install
      # Only the headless shell, which is the browser the suite launches.
      - cd tools/playground/frontend && npx --no-install playwright install --only-shell chromium
      - DAO_BUILD_DIR={{.BUILD_DIR}} bash tools/playground/browser_test.sh

  playground-dev:
    desc: Start playground in dev mode (Vite HMR on :5173, backend on :8090, backend restarts on rebuild)
    deps: [build]
    cmds:
      - task: playground-install
      - DAO_BUILD_DIR={{.BUILD_DIR}} bash tools/playground/dev.sh

  gen-tooling-surface:
    desc: Regenerate the playground's TypeScript and docs/tooling_capabilities.md from the analysis and service surfaces
    deps: [configure]
    cmds:
      - cmake --build {{.BUILD_DIR}} --target service_surface_dump -- -j${DAO_BUILD_JOBS:-4}
      - "{{.BUILD_DIR}}/tools/playground/compiler_service/service_surface_dump > tools/playground/frontend/src/generated/tooling_surface.ts"
      - "{{.BUILD_DIR}}/tools/playground/compiler_service/service_surface_dump --matrix > docs/tooling_capabilities.md"

  update-example-goldens:
    desc: Rewrite testdata/examples/*.out from the current compiler's output
    deps: [build]
    cmds:
      - DAO_UPDATE_GOLDENS=1 {{.BUILD_DIR}}/tools/playground/compiler_service/service_test

  bootstrap-assemble:
    desc: Assemble bootstrap .gen.dao files from upstream subsystem sources
    cmds:
      - bash bootstrap/assemble.sh
    sources:
      - bootstrap/assemble.sh
      - bootstrap/*/impl.dao
      - bootstrap/*/tests.dao
      - bootstrap/driver/main.dao
    generates:
      - bootstrap/mir/mir.gen.dao
      - bootstrap/llvm/llvm.gen.dao
      - bootstrap/driver/driver_tests.gen.dao
      - bootstrap/driver/driver.gen.dao

  bootstrap-test:
    desc: Assemble, build, and test all bootstrap subsystems
    deps: [build, bootstrap-assemble]
    cmds:
      - "{{.BUILD_DIR}}/compiler/driver/daoc build --source bootstrap/lexer/tests.dao --source bootstrap/lexer/impl.dao --source bootstrap/ascii.dao && ./bootstrap/lexer/tests"
      - "{{.BUILD_DIR}}/compiler/driver/daoc build --source bootstrap/parser/tests.dao --source bootstrap/parser/impl.dao --source bootstrap/lexer/impl.dao --source bootstrap/ascii.dao && ./bootstrap/parser/tests"
      - "{{.BUILD_DIR}}/compiler/driver/daoc build --source bootstrap/graph/tests.dao --source bootstrap/graph/impl.dao --source bootstrap/parser/impl.dao --source bootstrap/lexer/impl.dao --source bootstrap/ascii.dao && ./bootstrap/graph/tests"
      - "{{.BUILD_DIR}}/compiler/driver/daoc build --source bootstrap/resolver/tests.dao --source bootstrap/resolver/impl.dao --source bootstrap/shared/base.dao --source bootstrap/graph/impl.dao --source bootstrap/parser/impl.dao --source bootstrap/lexer/impl.dao --source bootstrap/ascii.dao && ./bootstrap/resolver/tests"
      - "{{.BUILD_DIR}}/compiler/driver/daoc build --source bootstrap/typecheck/tests.dao --source bootstrap/typecheck/impl.dao --source bootstrap/resolver/impl.dao --source bootstrap/shared/base.dao --source bootstrap/graph/impl.dao --source bootstrap/parser/impl.dao --source bootstrap/lexer/impl.dao --source bootstrap/ascii.dao && ./bootstrap/typecheck/tests"
      - "{{.BUILD_DIR}}/compiler/driver/daoc build --source bootstrap/hir/tests.dao --source bootstrap/hir/impl.dao --source bootstrap/typecheck/impl.dao --source bootstrap/resolver/impl.dao --source bootstrap/shared/base.dao --source bootstrap/graph/impl.dao --source bootstrap/parser/impl.dao --source bootstrap/lexer/impl.dao --source bootstrap/ascii.dao && ./bootstrap/hir/tests"
      - "{{.BUILD_DIR}}/compiler/driver/daoc build --source bootstrap/mir/mir.gen.dao --source bootstrap/hir/impl.dao --source bootstrap/typecheck/impl.dao --source bootstrap/resolver/impl.dao --source bootstrap/shared/base.dao --source bootstrap/graph/impl.dao --source bootstrap/parser/impl.dao --source bootstrap/lexer/impl.dao --source bootstrap/ascii.dao && ./bootstrap/mir/mir.gen"
      - rm -rf bootstrap/llvm/out && mkdir -p bootstrap/llvm/out
      - "{{.BUILD_DIR}}/compiler/driver/daoc build --source bootstrap/llvm/llvm.gen.dao --source bootstrap/hir/impl.dao --source bootstrap/typecheck/impl.dao --source bootstrap/resolver/impl.dao --source bootstrap/shared/base.dao --source bootstrap/graph/impl.dao --source bootstrap/parser/impl.dao --source bootstrap/lexer/impl.dao --source bootstrap/ascii.dao && ./bootstrap/llvm/llvm.gen"
      - bash bootstrap/validate_ir.sh {{.BUILD_DIR}}
      - rm -rf bootstrap/driver/out/driver_tests_work && mkdir -p bootstrap/driver/out/driver_tests_work
      - "{{.BUILD_DIR}}/compiler/driver/daoc build --source bootstrap/driver/driver_tests.gen.dao --source bootstrap/graph/impl.dao --source bootstrap/parser/impl.dao --source bootstrap/lexer/impl.dao --source bootstrap/ascii.dao && ./bootstrap/driver/driver_tests.gen bootstrap/driver/out/driver_tests_work"

  bootstrap-crossing:
    desc: Run the isolated Stage 1 -> Stage 2 -> Stage 3 crossing and Stage-2 suites
    deps: [build]
    cmds:
      - bash bootstrap/stage2.sh {{.BUILD_DIR}}

  bootstrap-audit:
    desc: Measure what the bootstrap corpus needs and where the bootstrap pipeline stops (docs/bootstrap_closure.md)
    deps: [build]
    cmds:
      - bash bootstrap/audit_closure.sh {{.BUILD_DIR}}

  bootstrap-validate-ir:
    desc: Compile, link, and run the IR the bootstrap LLVM suite emitted (bootstrap/llvm/out)
    cmds:
      - bash bootstrap/validate_ir.sh {{.BUILD_DIR}}

  forecast-device:
    desc: Lower forecast kernels from Dao MIR to Metal and run examples/forecast_plans.dao's plans on the GPU (macOS)
    platforms: [darwin]
    deps: [build]
    cmds:
      - mkdir -p {{.BUILD_DIR}}/forecast_device
      - "{{.BUILD_DIR}}/compiler/driver/daoc build examples/forecast_plans.dao"
      - "{{.BUILD_DIR}}/compiler/backend/msl/dao_msl_emit examples/forecast_plans.dao score_v1 high_wind adjust --bundle-out {{.BUILD_DIR}}/forecast_device/forecast_kernels.metal --manifest-out {{.BUILD_DIR}}/forecast_device/forecast_kernels.tsv"
      - swiftc -O examples/forecast_device/metal_runner.swift -o {{.BUILD_DIR}}/forecast_device/metal_runner
      - "./examples/forecast_plans | {{.BUILD_DIR}}/forecast_device/metal_runner --msl {{.BUILD_DIR}}/forecast_device/forecast_kernels.metal --kernels {{.BUILD_DIR}}/forecast_device/forecast_kernels.tsv --cpu-bin ./examples/forecast_plans"

  format:
    desc: Run clang-format on all source files
    cmds:
      - find compiler tools -name '*.cpp' -o -name '*.h' | xargs clang-format -i

  format-check:
    desc: Check clang-format without modifying files
    cmds:
      - find compiler tools -name '*.cpp' -o -name '*.h' | xargs clang-format --dry-run --Werror

  lint:
    desc: Run clang-tidy on all source files
    deps: [configure]
    cmds:
      - find compiler tools -name '*.cpp' | xargs clang-tidy -p {{.BUILD_DIR}}

  lex:
    desc: "Run daoc lex on a file (usage: task lex -- file.dao)"
    deps: [build]
    cmds:
      - "{{.BUILD_DIR}}/compiler/driver/daoc lex {{.CLI_ARGS}}"

  parse:
    desc: "Run daoc parse on a file (usage: task parse -- file.dao)"
    deps: [build]
    cmds:
      - "{{.BUILD_DIR}}/compiler/driver/daoc parse {{.CLI_ARGS}}"

  ast:
    desc: "Run daoc ast on a file (usage: task ast -- file.dao)"
    deps: [build]
    cmds:
      - "{{.BUILD_DIR}}/compiler/driver/daoc ast {{.CLI_ARGS}}"

  fmt:
    desc: "Run daoc fmt on Dao file(s) (usage: task fmt -- [--check|--write] file.dao)"
    deps: [build]
    cmds:
      - "{{.BUILD_DIR}}/compiler/driver/daoc fmt {{.CLI_ARGS}}"

  tokens:
    desc: "Run daoc tokens on a file (usage: task tokens -- file.dao)"
    deps: [build]
    cmds:
      - "{{.BUILD_DIR}}/compiler/driver/daoc tokens {{.CLI_ARGS}}"

  resolve:
    desc: "Run daoc resolve on a file (usage: task resolve -- file.dao)"
    deps: [build]
    cmds:
      - "{{.BUILD_DIR}}/compiler/driver/daoc resolve {{.CLI_ARGS}}"

  llvm-ir:
    desc: "Run daoc llvm-ir on a file (usage: task llvm-ir -- file.dao)"
    deps: [build]
    cmds:
      - "{{.BUILD_DIR}}/compiler/driver/daoc llvm-ir {{.CLI_ARGS}}"

  compile:
    desc: "Compile a .dao file to a native executable (usage: task compile -- file.dao)"
    deps: [build]
    cmds:
      - "{{.BUILD_DIR}}/compiler/driver/daoc build {{.CLI_ARGS}}"
